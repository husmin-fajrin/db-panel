{{define "title"}}Tambah server{{end}}
{{define "content"}}
<h1 class="text-2xl font-bold mb-4">Tambah server</h1>
<div class="card bg-base-100 shadow max-w-lg">
  <form method="post" action="/servers" class="card-body gap-4">
    <fieldset class="fieldset">
      <label class="label" for="name">Nama server</label>
      <input type="text" id="name" name="name" value="{{.Name}}" class="input w-full" placeholder="mis. db-rawat-inap" required autofocus>
      <p class="label">Setelah disimpan, panel menampilkan perintah untuk memasang agent di server tersebut.</p>
    </fieldset>
    <div class="card-actions justify-end">
      <a href="/servers" class="btn btn-ghost">Batal</a>
      <button type="submit" class="btn btn-primary">Simpan</button>
    </div>
  </form>
</div>
{{end}}
