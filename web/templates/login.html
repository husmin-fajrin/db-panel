{{define "title"}}Masuk{{end}}
{{define "content"}}
<div class="flex justify-center">
  <div class="card bg-base-100 w-full max-w-sm">
    <form method="post" action="/login" class="card-body gap-4 p-6">
      <p class="logo text-primary text-center">dbpanel</p>
      <h1 class="text-center">Masuk</h1>
      <input type="hidden" name="next" value="{{.Next}}">
      <fieldset class="fieldset">
        <label class="label" for="username">Nama pengguna</label>
        <input type="text" id="username" name="username" value="{{.FormUsername}}" class="input w-full" autocomplete="username" required autofocus>
        <label class="label" for="password">Kata sandi</label>
        <input type="password" id="password" name="password" class="input w-full" autocomplete="current-password" required>
      </fieldset>
      <button type="submit" class="btn btn-primary w-full">Masuk</button>
    </form>
  </div>
</div>
{{end}}
