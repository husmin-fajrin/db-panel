{{define "title"}}Dashboard{{end}}
{{define "content"}}
<h1 class="text-2xl font-bold mb-4">Dashboard</h1>
<div class="stats stats-vertical md:stats-horizontal bg-base-100 shadow w-full">
  <div class="stat">
    <div class="stat-title">Jumlah server</div>
    <div class="stat-value" data-stat="total">{{.Total}}</div>
  </div>
  <div class="stat">
    <div class="stat-title">Online</div>
    <div class="stat-value text-success" data-stat="online">{{.Online}}</div>
  </div>
  <div class="stat">
    <div class="stat-title">Belum dipasangkan</div>
    <div class="stat-value text-warning" data-stat="unpaired">{{.Unpaired}}</div>
  </div>
</div>
<div class="mt-6 flex gap-2">
  <a href="/servers" class="btn">Lihat daftar server</a>
  <a href="/servers/new" class="btn btn-primary">Tambah server</a>
</div>
{{end}}
